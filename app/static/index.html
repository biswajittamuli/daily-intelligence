<!doctype html>
<html lang="en" data-theme="minimal-light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Daily Intelligence</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app.css">
  <script>try{var t=localStorage.getItem('di-theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#daily-briefing" aria-label="Daily Intelligence home">
      <img class="brand-mark" src="/icon.svg" alt="">
      <span><strong>Daily Intelligence</strong><small>Local workspace</small></span>
    </a>
    <nav id="navigation" aria-label="Primary navigation"></nav>
    <div class="sidebar-bottom">
      <a class="side-resume" href="#resumes" data-view="resumes" id="side-resume"><span>Active resume</span><b>—</b></a>
      <div class="side-footer"><span id="version-tag"></span><button class="link-button" id="quit-app" title="Stop the local server">Quit</button></div>
    </div>
  </aside>
  <main class="main-shell">
    <header class="topbar">
      <button id="mobile-menu" class="icon-button mobile-only" aria-label="Toggle navigation">☰</button>
      <div class="breadcrumbs"><span>Workspace</span><span class="crumb-sep">/</span><b id="page-crumb">Daily briefing</b></div>
      <div class="top-actions"><span class="connection-pill" id="connection"><i></i>Local</span><button class="icon-button" id="theme-toggle" title="Switch theme" aria-label="Switch theme">◐</button></div>
    </header>
    <div class="page-wrap" id="page-content" aria-live="polite"></div>
  </main>
  <div id="toast" class="toast" role="status"></div>
  <script src="/app.js" defer></script>
</body>
</html>
