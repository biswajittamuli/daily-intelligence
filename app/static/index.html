<!doctype html>
<html lang="en" data-theme="minimal-light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Daily Intelligence</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app.css">
  <script>try{var t=localStorage.getItem('di-theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#home" data-view="home" aria-label="Daily Intelligence home">
      <img class="brand-mark" src="/icon.svg" alt=""><strong>Daily Intelligence</strong>
    </a>
    <span class="crumb" id="page-crumb" aria-live="polite"></span>
    <button class="command-trigger" id="command-trigger" type="button" aria-haspopup="dialog" aria-controls="palette">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span>Search or ask…</span><kbd>Ctrl K</kbd>
    </button>
    <div class="top-actions">
      <button class="discover-button" id="discover-top" type="button" data-action="discover" title="Run every enabled source now">Discover</button>
      <span class="connection-pill" id="connection" role="status"></span>
      <button class="icon-button" id="theme-toggle" title="Switch theme" aria-label="Switch theme"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/></svg></button>
      <button class="icon-button" id="mobile-menu" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    </div>
  </header>
  <div class="progress-line" id="progress-line" hidden><span></span></div>
  <aside class="drawer" id="sidebar" aria-label="Menu">
    <div class="drawer-head"><strong>Menu</strong><button class="icon-button" data-action="close-drawer" aria-label="Close menu">✕</button></div>
    <nav id="navigation" aria-label="Sections"></nav>
    <div class="sidebar-bottom">
      <a class="side-resume" href="#resumes" data-view="resumes" id="side-resume"><span>Active resume</span><b>—</b></a>
      <div class="side-footer"><span id="version-tag"></span><button class="link-button" id="quit-app" title="Stop the local server">Quit</button></div>
    </div>
  </aside>
  <div class="scrim" id="scrim" data-action="close-drawer" hidden></div>
  <main class="main-shell">
    <div class="page-wrap" id="page-content" aria-live="polite"></div>
  </main>
  <div class="palette" id="palette" role="dialog" aria-modal="true" aria-label="Command palette" hidden></div>
  <div id="toast" class="toast" role="status"></div>
  <!-- Classic scripts sharing one global scope; defer keeps this order. events.js must stay last. -->
  <script src="/js/core.js" defer></script>
  <script src="/js/jobs.js" defer></script>
  <script src="/js/market.js" defer></script>
  <script src="/js/intel.js" defer></script>
  <script src="/js/planning.js" defer></script>
  <script src="/js/settings.js" defer></script>
  <script src="/js/startups.js" defer></script>
  <script src="/js/briefing-skills.js" defer></script>
  <script src="/js/home.js" defer></script>
  <script src="/js/palette.js" defer></script>
  <script src="/js/events.js" defer></script>
</body>
</html>
